{% extends "base.html" %}
{% block title %}Log in · Employee File Scanner{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Welcome back</h1>
  <p class="muted">Log in to scan employee onboarding files and export to Excel.</p>
  <form method="post" action="{{ url_for('login') }}">
    <label>Username
      <input name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn primary" type="submit">Log in</button>
  </form>
  {% if allow_registration %}
    <p class="muted center">No account yet?
      <a href="{{ url_for('register') }}">Create one</a>
    </p>
  {% endif %}
</div>
{% endblock %}
